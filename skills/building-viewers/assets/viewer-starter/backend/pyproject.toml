[project]
name = "__VIEWER_PACKAGE_DASHED__"
version = "0.1.0"
description = "Read-only browser viewer backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "pydantic>=2.13.0",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__VIEWER_PACKAGE_NAME__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
